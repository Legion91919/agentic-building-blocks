name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AgenticBuildingBlocks.sln

      - name: Build (warnings as errors, analyzers on)
        run: dotnet build AgenticBuildingBlocks.sln --no-restore -c Release

      - name: Format check (whitespace)
        run: dotnet format whitespace AgenticBuildingBlocks.sln --verify-no-changes

      - name: Test with coverage
        run: dotnet test AgenticBuildingBlocks.sln --no-build -c Release --collect:"XPlat Code Coverage" --results-directory TestResults --logger "trx"

      - name: Coverage gate (70% line, ratchet up over time)
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage -reporttypes:TextSummary -assemblyfilters:"+Agentic.Blocks.*;-*.Tests"
          cat coverage/Summary.txt
          pct=$(grep -oP 'Line coverage: \K[0-9.]+' coverage/Summary.txt)
          awk -v p="$pct" 'BEGIN { exit (p < 70) }' || { echo "Line coverage $pct% is below 70%"; exit 1; }

      - name: Vulnerable packages
        run: |
          dotnet list AgenticBuildingBlocks.sln package --vulnerable --include-transitive | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt

  pack:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.1.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
      - name: Pack every block
        run: |
          for p in src/*/*.csproj; do
            dotnet pack "$p" -c Release -o artifacts/packages \
              -p:Version=${{ steps.version.outputs.value }} \
              -p:RepositoryUrl=${{ github.server_url }}/${{ github.repository }} \
              -p:PackageProjectUrl=${{ github.server_url }}/${{ github.repository }} \
              -p:ContinuousIntegrationBuild=true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/packages
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Privacy guard (secrets + personal data)
        run: python3 tools/privacy_guard.py --all

  handover-readiness:
    # Optional: set the repository variable KIT_REPO (owner/name of the Agentic Engineering Kit) to enable.
    if: vars.KIT_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install arch-advisor
        run: |
          git clone --depth 1 https://github.com/${{ vars.KIT_REPO }} /tmp/kit
          dotnet pack /tmp/kit/src/ArchAdvisor.Mcp -c Release -o /tmp/nupkg
          dotnet tool install -g arch-advisor --add-source /tmp/nupkg
      - name: Handover readiness (min 80%)
        run: arch-advisor check . --min 80
